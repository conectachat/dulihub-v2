name: CI

# Roda em tudo que chega ao main, e em toda proposta de mudança.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    # No nível do job: o build precisa das chaves públicas, e RLS e fumaça
    # precisam das contas de teste. Sem os segredos, os passos que dependem
    # deles falham — de propósito.
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      RLS_SENHA_PARCEIRO: ${{ secrets.RLS_SENHA_PARCEIRO }}
      RLS_SENHA_COLABORADOR: ${{ secrets.RLS_SENHA_COLABORADOR }}
      RLS_SENHA_CLIENTE: ${{ secrets.RLS_SENHA_CLIENTE }}
    steps:
      # v5 roda em Node 24; a v4 está marcada como obsoleta pelo GitHub.
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      # --frozen-lockfile: o CI não pode resolver versão diferente da que
      # roda na máquina. Se o lockfile estiver desatualizado, é para falhar
      # aqui e não virar "na minha máquina funciona".
      - run: bun install --frozen-lockfile

      # `typecheck` gera antes os tipos de rota do Next (`LayoutProps`,
      # `PageProps`). Eles moram em `.next/`, que não vai para o repositório:
      # na máquina existem porque o servidor já rodou, num clone limpo não.
      # Foi isso que deixou este passo vermelho desde o primeiro push.
      - name: Tipos
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      # A suíte roda aqui, e não no gancho local, porque levantar o jsdom
      # custa segundos demais para cobrar a cada commit.
      - name: Testes
        run: bun run test

      # A separação entre a Duli e cada parceiro está inteira na RLS: nenhuma
      # query da aplicação filtra por organização. Uma policy que afrouxa não
      # quebra nada — só passa a mostrar a carteira alheia. Por isso este passo
      # existe, e por isso ele não é condicional: sem os segredos configurados
      # o CI falha, que é o comportamento certo.
      - name: Testes de RLS
        run: bun run test:rls

      # Cada tela abre com sessão de verdade. Tipos, lint, build e os testes
      # acima passavam enquanto /contatos estava fora do ar em produção (18/set):
      # o erro só existe quando a página é desenhada. Aqui ela é desenhada.
      - name: Build
        run: bun run build

      - name: Subir o app
        run: |
          bun run start &
          for i in $(seq 1 60); do
            curl -s -o /dev/null http://localhost:3000 && exit 0
            sleep 1
          done
          echo "O app não respondeu em 60 s" && exit 1

      - name: Fumaça
        run: bun run test:fumaca
